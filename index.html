<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>😄</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    display:none;
    z-index:2;
}

#scare{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:1;
}
</style>

</head>

<body>

<img id="scare" src="screamer.jpg">

<div id="flash"></div>


<audio id="audio" preload="auto">
    <source src="https://saturnorkt.github.io/tito-con-un-traba-hecho-con-ia/scream.mp3" type="audio/mpeg">
</audio>


<script>

const flash = document.getElementById("flash");
const img = document.getElementById("scare");
const audio = document.getElementById("audio");


document.addEventListener("click", function(){

    console.log("Click detectado");


    // Mostrar imagen
    img.style.display = "block";


    // Reproducir sonido
    audio.play()
    .then(()=>{
        console.log("Audio OK");
    })
    .catch(error=>{
        console.log("Error audio:", error);
    });



    // Parpadeo
    let i = 0;

    let effect = setInterval(()=>{

        flash.style.display =
        flash.style.display === "block"
        ? "none"
        : "block";


        i++;


        if(i >= 30){

            clearInterval(effect);
            flash.style.display="none";

        }

    },80);


}, {once:true});


</script>

</body>
</html>
