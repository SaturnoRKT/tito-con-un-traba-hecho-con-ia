<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>😄</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    display:none;
}

img{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}
</style>
</head>
<body>

<img id="scare" src="screamer.jpg">
<div id="flash"></div>

<audio id="audio" src="scream.mp3"></audio>

<script>
const flash = document.getElementById("flash");
const img = document.getElementById("scare");
const audio = document.getElementById("audio");

function start(){

    img.style.display="block";

    audio.play().catch(()=>{});

    let i=0;

    const effect = setInterval(()=>{
        flash.style.display =
            flash.style.display==="none" ? "block" : "none";

        i++;

        if(i>30){
            clearInterval(effect);
            flash.style.display="none";
        }
    },80);
}

setTimeout(start,1000);
</script>

</body>
</html>
