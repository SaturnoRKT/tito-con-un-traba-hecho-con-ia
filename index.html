<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>😄</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    display:none;
    z-index:2;
}

img{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:1;
}
</style>

</head>

<body>

<img id="scare" src="screamer.jpg">

<div id="flash"></div>

<audio id="audio" src="scream.mp3" preload="auto"></audio>


<script>

const flash = document.getElementById("flash");
const img = document.getElementById("scare");
const audio = document.getElementById("audio");


function start(){

    // Mostrar imagen
    img.style.display = "block";


    // Activar sonido
    audio.volume = 1;
    audio.currentTime = 0;

    audio.play()
    .then(() => {
        console.log("Sonido reproducido correctamente");
    })
    .catch(error => {
        console.log("El navegador bloqueó el audio:", error);
    });



    // Efecto de parpadeo
    let i = 0;

    const effect = setInterval(() => {

        if(flash.style.display === "none"){
            flash.style.display = "block";
        }else{
            flash.style.display = "none";
        }


        i++;


        if(i > 30){

            clearInterval(effect);
            flash.style.display = "none";

        }

    },80);

}


// Espera un click para permitir el audio
document.addEventListener("click", start, {once:true});


</script>


</body>
</html>
