<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>😄</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    display:none;
    z-index:2;
}

img{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:1;
}
</style>

</head>

<body>

<img id="scare" src="screamer.jpg">

<div id="flash"></div>

<audio id="audio" preload="auto">
    <source src="https://saturnorkt.github.io/tito-con-un-traba-hecho-con-ia/scream.mp3" type="audio/mpeg">
</audio>


<script>

const flash = document.getElementById("flash");
const img = document.getElementById("scare");
const audio = document.getElementById("audio");


function start(){

    console.log("Iniciando screamer");


    // Mostrar imagen
    img.style.display = "block";


    // Preparar y reproducir audio
    audio.currentTime = 0;
    audio.volume = 1;

    audio.play()
    .then(() => {
        console.log("✅ Audio reproducido correctamente");
    })
    .catch((error) => {
        console.error("❌ Error al reproducir audio:", error);
    });



    // Efecto de flash
    let i = 0;

    const effect = setInterval(() => {

        if(flash.style.display === "block"){
            flash.style.display = "none";
        }else{
            flash.style.display = "block";
        }


        i++;


        if(i >= 30){

            clearInterval(effect);
            flash.style.display = "none";

        }

    },80);

}


// Activar al primer click
document.addEventListener("click", () => {

    start();

}, {once:true});
